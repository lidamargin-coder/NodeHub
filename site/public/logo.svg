<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hexGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DFFA2"/>
      <stop offset="100%" stop-color="#1CE47E"/>
    </linearGradient>
    <linearGradient id="hexGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18B864"/>
      <stop offset="100%" stop-color="#0E5E35"/>
    </linearGradient>
    <linearGradient id="hexGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#128E4D"/>
      <stop offset="100%" stop-color="#093B21"/>
    </linearGradient>
    <filter id="nodeGlow3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Badge -->
  <rect width="128" height="128" rx="28" fill="#09100D"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#1B2B23" stroke-width="1.5"/>

  <!-- Outer Hexagonal Frame -->
  <polygon points="64,18 102,40 102,84 64,106 26,84 26,40" fill="#0D1713" stroke="#223B2E" stroke-width="2"/>

  <!-- Isometric Inner Core (The Mod Unit / Node) -->
  <!-- Top Face -->
  <polygon points="64,36 88,50 64,64 40,50" fill="url(#hexGradTop)"/>
  <!-- Left Face -->
  <polygon points="40,50 64,64 64,92 40,78" fill="url(#hexGradLeft)"/>
  <!-- Right Face -->
  <polygon points="64,64 88,50 88,78 64,92" fill="url(#hexGradRight)"/>

  <!-- Core Highlights / Inner Node Point -->
  <circle cx="64" cy="64" r="5" fill="#FFFFFF" filter="url(#nodeGlow3)"/>

  <!-- Radiating Node Terminals at Hexagon Vertices -->
  <circle cx="64" cy="18" r="4.5" fill="#3DFFA2"/>
  <circle cx="102" cy="40" r="3.5" fill="#1CE47E"/>
  <circle cx="102" cy="84" r="3.5" fill="#1CE47E"/>
  <circle cx="64" cy="106" r="4.5" fill="#3DFFA2"/>
  <circle cx="26" cy="84" r="3.5" fill="#1CE47E"/>
  <circle cx="26" cy="40" r="3.5" fill="#1CE47E"/>

  <!-- Trace lines to outer vertices -->
  <line x1="64" y1="36" x2="64" y2="18" stroke="#3DFFA2" stroke-width="2"/>
  <line x1="88" y1="50" x2="102" y2="40" stroke="#1CE47E" stroke-width="2"/>
  <line x1="88" y1="78" x2="102" y2="84" stroke="#1CE47E" stroke-width="2"/>
  <line x1="64" y1="92" x2="64" y2="106" stroke="#3DFFA2" stroke-width="2"/>
  <line x1="40" y1="78" x2="26" y2="84" stroke="#1CE47E" stroke-width="2"/>
  <line x1="40" y1="50" x2="26" y2="40" stroke="#1CE47E" stroke-width="2"/>
</svg>
